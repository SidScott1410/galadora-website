    <!-- ── Structured Data: Organization (JSON-LD) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Galadora Technologies",
      "alternateName": "Galadora",
      "url": "https://galadora.com",
      "logo": "https://galadora.com/logo.png",
      "description": "Galadora builds and operates distributed, air-gapped AI infrastructure for enterprises and governments - sovereign-capable, power-ready, and built from first principles.",
      "foundingDate": "2024",
      "industry": "Artificial Intelligence Infrastructure",
      "keywords": ["microscale AI infrastructure", "air-gapped AI", "sovereign AI", "distributed inference", "edge AI infrastructure"],
      "sameAs": [
        "https://www.linkedin.com/company/galadora",
        "https://twitter.com/galadora"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "business inquiries",
        "url": "https://galadora.com/contact"
      }
    }
    </script>

    <!-- ── Structured Data: WebSite with SearchAction ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Galadora Technologies",
      "url": "https://galadora.com",
      "description": "Infrastructure for the Inference Era - microscale, air-gapped, sovereign-capable AI infrastructure.",
      "inLanguage": "en-US",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://galadora.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── Structured Data: WebPage ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Galadora Technologies - Infrastructure for the Inference Era",
      "url": "https://galadora.com/",
      "description": "Galadora builds microscale, air-gapped AI infrastructure for enterprises and governments - sovereign-capable, power-ready, and built from first principles.",
      "isPartOf": { "@type": "WebSite", "url": "https://galadora.com" },
      "about": {
        "@type": "Thing",
        "name": "Microscale AI Infrastructure",
        "description": "Distributed, air-gapped, sovereign-capable AI infrastructure deployable at edge scale"
      },
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://galadora.com/" }
        ]
      }
    }
    </script>

    <!-- ── Favicon ── -->

    <link rel="manifest" href="/manifest.json" />

    <link rel="preload" as="image" href="/media/galadora-logo-white.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/media/galadora-hero-poster.jpg" fetchpriority="high" />
