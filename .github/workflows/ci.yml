name: CI — Build & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          VITE_ANALYTICS_ENDPOINT: ''
          VITE_ANALYTICS_WEBSITE_ID: ''
          BUILT_IN_FORGE_API_KEY: ''
          BUILT_IN_FORGE_API_URL: ''
          VITE_FRONTEND_FORGE_API_KEY: ''
          VITE_FRONTEND_FORGE_API_URL: ''
          VITE_APP_ID: 'galadora'
          VITE_APP_TITLE: 'Galadora Technologies'
          VITE_APP_LOGO: ''
          VITE_OAUTH_PORTAL_URL: ''
          JWT_SECRET: 'ci-placeholder'
          OAUTH_SERVER_URL: ''
          OWNER_NAME: 'Galadora'
          OWNER_OPEN_ID: ''

      - name: Verify build output
        run: |
          echo "Build output:"
          ls -lh dist/public/
          test -f dist/public/index.html && echo "✓ index.html present"
          test -f dist/public/robots.txt && echo "✓ robots.txt present"
          test -f dist/public/sitemap.xml && echo "✓ sitemap.xml present"
          test -f dist/public/llms.txt && echo "✓ llms.txt present"
          test -f dist/public/manifest.json && echo "✓ manifest.json present"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/public/
          retention-days: 7
